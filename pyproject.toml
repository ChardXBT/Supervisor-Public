[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "self-recovering-automation"
version = "1.0.0"
description = "A public demo of a manager that schedules, monitors, and recovers automation jobs."
requires-python = ">=3.11"

[project.scripts]
automation-demo = "self_recovering_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
