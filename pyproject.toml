[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-public"
version = "1.0.0"
description = "A sanitized architectural model of a self-recovering automation supervisor."
requires-python = ">=3.11"

[project.scripts]
supervisor-demo = "supervisor_public.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
